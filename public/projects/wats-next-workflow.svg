<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7d8898"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#34d399"/>
    </marker>
    <style>
      .box { fill: #0b0e14; stroke: #2c3643; stroke-width: 1.5; }
      .dash { fill: #0b0e14; stroke: #7d8898; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .acc { fill: #0b0e14; stroke: #34d399; stroke-width: 1.8; }
      .ln { stroke: #7d8898; stroke-width: 1.8; fill: none; }
      .lg { stroke: #34d399; stroke-width: 1.8; fill: none; }
      .zone { stroke: #2c3643; stroke-width: 1.5; stroke-dasharray: 3 6; }
      .t { fill: #e6edf3; font-size: 21px; font-weight: 600; text-anchor: middle; }
      .s { fill: #9aa4b2; font-size: 17px; text-anchor: middle; }
      .cap { fill: #7d8898; font-size: 16px; letter-spacing: 1.5px; text-anchor: middle; }
      .capg { fill: #34d399; font-size: 16px; letter-spacing: 1.5px; text-anchor: middle; }
      .note { fill: #c9d1d9; font-size: 20px; text-anchor: middle; }
    </style>
  </defs>

  <!-- zones: model | human | code -->
  <line class="zone" x1="325" y1="30" x2="325" y2="530"/>
  <line class="zone" x1="635" y1="30" x2="635" y2="530"/>
  <text class="cap" x="165" y="50">MODEL PROPOSES</text>
  <text class="capg" x="480" y="50">HUMAN DECIDES</text>
  <text class="cap" x="795" y="50">CODE APPLIES</text>

  <!-- model zone -->
  <rect class="box" x="40" y="85" width="250" height="90" rx="10"/>
  <text class="t" x="165" y="124">Meeting transcript</text>
  <text class="s" x="165" y="150">+ current open actions</text>

  <rect class="dash" x="40" y="260" width="250" height="120" rx="10"/>
  <text class="t" x="165" y="302">AI proposal</text>
  <text class="s" x="165" y="330">reconciled with open actions</text>
  <text class="s" x="165" y="354">schema-validated JSON</text>
  <path class="ln" d="M165 175 V258" marker-end="url(#a)"/>

  <!-- human zone -->
  <rect class="box" x="355" y="260" width="250" height="120" rx="10"/>
  <text class="t" x="480" y="302">Review</text>
  <text class="s" x="480" y="330">current vs proposed</text>
  <text class="s" x="480" y="354">nothing saved yet</text>
  <path class="ln" d="M292 320 H353" marker-end="url(#a)"/>

  <rect class="acc" x="355" y="85" width="250" height="90" rx="10"/>
  <text class="t" x="480" y="124">Approve</text>
  <text class="s" x="480" y="150">human decision</text>
  <path class="lg" d="M480 260 V177" marker-end="url(#g)"/>

  <rect class="box" x="355" y="440" width="250" height="90" rx="10"/>
  <text class="t" x="480" y="479">Reject with feedback</text>
  <text class="s" x="480" y="505">nothing applied</text>
  <path class="ln" d="M480 380 V438" marker-end="url(#a)"/>
  <path class="ln" d="M355 485 H165 V382" marker-end="url(#a)"/>
  <text class="s" x="260" y="475">revised proposal</text>

  <!-- code zone -->
  <rect class="box" x="670" y="85" width="250" height="90" rx="10"/>
  <text class="t" x="795" y="124">Apply by action ID</text>
  <text class="s" x="795" y="150">deterministic code</text>
  <path class="lg" d="M605 130 H668" marker-end="url(#g)"/>

  <rect class="box" x="670" y="260" width="250" height="120" rx="10"/>
  <text class="t" x="795" y="302">Saved action items</text>
  <text class="s" x="795" y="330">SQLAlchemy models</text>
  <text class="s" x="795" y="354">+ weekly report</text>
  <path class="ln" d="M795 175 V258" marker-end="url(#a)"/>

  <text class="note" x="480" y="575">The model proposes. A person approves. Code applies.</text>
</svg>
